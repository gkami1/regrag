[project]
name = "regrag"
version = "0.1.0"
description = "RAG for engineering standards and regulations"
readme = "README.md"
authors = [
    { name = "gkami1", email = "gabdulhakovkamil@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.26.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.1",
    "tokenizers>=0.23.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
regrag = "regrag:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ipykernel",
    "jupyterlab",
]

# PyTorch's CUDA builds are not on PyPI (PyPI's Windows wheel is CPU-only), they
# live on PyTorch's own index. `explicit = true` means this index is used ONLY for
# packages mapped to it below; everything else still comes from PyPI.
# cu126 = CUDA 12.6 runtime, bundled in the wheel (only an NVIDIA driver is
# needed); it still ships kernels for older GPUs such as Turing (GTX 16xx).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Tests run Qdrant in local mode, which ignores payload indexes by design.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
